services:
  demo_image:
    image: ghcr.io/pgovm/igvc-base:latest
    container_name: please_work
    pull_policy: always
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    gpus: all

    volumes:
      - /home/govind/IGVC_robot_2026:/root/IGVC_robot_2026
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev

    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all