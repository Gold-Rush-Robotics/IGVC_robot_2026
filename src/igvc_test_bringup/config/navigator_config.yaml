igvc_navigator:
  ros__parameters:
    # Nav2 controller bridge. These IDs match nav2_lane_follow_config.yaml.
    follow_path_enabled: true
    follow_path_action: "follow_path"
    controller_id: "FollowPath"
    goal_checker_id: "goal_checker"
    progress_checker_id: "progress_checker"

    # GPS waypoints are owned by mission_planner_node.  Keep this false so
    # live /gps/fix samples are not converted into preemptive NavigateToPose
    # goals before the mission starts.
    gps_fix_waypoint_follow_enabled: false

    # Local lane path extraction and update discipline.
    # Camera segmentation can publish /lane_costmap at ~0.4-1.0 Hz under load;
    # keep the latest valid grid long enough for the navigator to use it, but
    # bounded so a stale corridor can't outlive the robot's position.  At
    # 1.5 m/s a 2 s grid is ~3 m old worst-case; the skew guard must be
    # TIGHTER than the costmap age or it does nothing.
    max_costmap_age_sec: 2.0
    max_odom_age_sec: 0.5
    max_odom_costmap_skew_sec: 0.8
    path_lookahead_m: 4.0
    # Reduced from 1.0s → 0.33s so the path refreshes ~3x per second; at
    # 0.45 m/s this means no more than ~15 cm of stale corridor on turns.
    replan_min_dt_sec: 0.33
    min_follow_path_poses: 5
    min_follow_path_length_m: 1.5
    path_sample_spacing_m: 0.10
    path_smooth_window: 5
    # NOTE: path_change_tolerance_{m,rad} are set once below in the FollowPath
    # section (0.8 / 0.4).  Do not redeclare them here - ROS 2 keeps the last
    # value, so an earlier pair would be silently dead.
    max_path_lateral_jump_m: 0.60
    centreline_gap_tolerance_m: 2.0
    fallback_path_length_m: 2.0
    allow_straight_fallback: false

    # Obstacle map for centreline extraction overlay.
    obstacle_map_topic: "/lidar_obstacle_map"

    # Legacy fallback if direct FollowPath bringup needs to be disabled.
    waypoint_horizon_m: 1.8
    # Increased from 0.6 m: replanning every 0.6 m let the planner keep
    # switching sides on each trigger.  At 2.0 m the robot travels further
    # along the committed route before it can pick a different side.
    replan_dist_m: 2.0
    # Raised from 0.25 m: small path deviations near obstacle inflation no
    # longer trigger a full replan — prevents flip-flopping when both side
    # paths have similar cost at the edge of the inflation gradient.
    path_change_tolerance_m: 0.8
    path_change_tolerance_rad: 0.4
    lane_hold_sec: 1.0

    # Centreline hysteresis: soft Dijkstra cost discount for cells near the
    # previously chosen centreline.  Keeps the planner committed to a chosen
    # obstacle-pass side while still consuming fresh lane evidence every
    # cycle.  Weight is small relative to clearance/unknown penalties so a
    # genuinely better route still wins.
    prev_path_bias_weight: 0.4
    prev_path_bias_radius_m: 0.30

    # Watchdog: if mission_planner owns navigation (GPS/ramp) but stops
    # publishing /mission/state for this long, reclaim lane following so a
    # planner crash can't strand the robot.
    mission_state_timeout_sec: 10.0

    # Stuck recovery: when the forward corridor stays blocked, hold for
    # stuck_timeout_sec then back up (slowly, bounded distance) and re-plan
    # instead of stalling against the obstacle / lane line.  The 360° lidar
    # rear StopZone in the collision monitor guards the reverse.
    stuck_reverse_enabled: true
    stuck_timeout_sec: 3.0
    reverse_speed_mps: 0.30
    reverse_max_dist_m: 0.80
    reverse_cmd_topic: "cmd_vel_nav"
