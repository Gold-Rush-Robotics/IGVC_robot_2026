igvc_navigator:
  ros__parameters:
    # Nav2 controller bridge. These IDs match nav2_lane_follow_config.yaml.
    follow_path_enabled: true
    follow_path_action: "follow_path"
    controller_id: "FollowPath"
    goal_checker_id: "goal_checker"
    progress_checker_id: "progress_checker"

    # Local lane path extraction and update discipline.
    path_lookahead_m: 4.0
    replan_min_dt_sec: 1.0
    min_follow_path_poses: 5
    min_follow_path_length_m: 1.5
    path_sample_spacing_m: 0.10
    path_smooth_window: 5
    path_change_tolerance_m: 0.25
    path_change_tolerance_rad: 0.25
    max_path_lateral_jump_m: 0.5

    # Legacy fallback if direct FollowPath bringup needs to be disabled.
    waypoint_horizon_m: 1.8
    replan_dist_m: 0.6
    lane_hold_sec: 1.0
