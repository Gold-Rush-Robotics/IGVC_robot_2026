# ──────────────────────────────────────────────────────────────────────────────
#  Nav2 params for GPS waypoint testing (no lane segmentation required)
#
#  Derived from nav2_lane_follow_config.yaml with lane_layer removed.  This
#  test launch does NOT run lidar_obstacle_costmap_node, so /lidar_obstacle_map
#  is never published; a StaticLayer waiting on that topic never marks the
#  costmap "current" and Nav2 reports costmap-update timeouts and refuses to
#  plan.  Instead this config uses a live ObstacleLayer that reads /scan
#  directly: it does not block costmap currency when /scan is absent (empty
#  costmap -> planner plans freely) and still avoids obstacles when the lidar
#  is running.
#
#  Costmap layers (local & global):
#    1. obstacle_layer    — live /scan LaserScan observations
#    2. inflation_layer   — inflates all obstacles by robot radius + margin
# ──────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 1.0
    default_nav_to_pose_bt_xml: ""

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.3
      downsample_costmap: true
      downsampling_factor: 1
      allow_unknown: true              # no lane map — treat unknown space as free
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 45.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5          # GPS is ~1-2m accuracy outdoors
      yaw_goal_tolerance: 0.5
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.5
      desired_angular_vel: 1.5
      lookahead_dist: 1.2
      min_lookahead_dist: 0.6
      max_lookahead_dist: 2.6
      lookahead_time: 1.35
      rotate_to_heading_angular_vel: 1.5
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 1.0
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.50
      cost_scaling_gain: 2.0
      regulated_linear_scaling_min_radius: 1.4
      regulated_linear_scaling_min_speed: 0.40
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 1.57
      # Must exceed max_lookahead_dist (2.6 m); RPP uses this as the upper
      # bound for its carrot search so if it is smaller than the lookahead
      # RPP logs "carrot outside range" and refuses to move.
      max_robot_pose_search_dist: 10.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/diff_drive_controller/cmd_vel_unstamped"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 1.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["SlowZone", "StopZone", "RearStopZone"]

    SlowZone:
      type: "polygon"
      points: "[[1.0, 0.5], [1.0, -0.5], [0.0, -0.5], [0.0, 0.5]]"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 2
      enabled: false
    StopZone:
      type: "polygon"
      points: "[[0.55, 0.4], [0.55, -0.4], [0.0, -0.4], [0.0, 0.4]]"
      action_type: "stop"
      min_points: 2
      enabled: false
    RearStopZone:
      type: "polygon"
      points: "[[-0.55, 0.35], [-0.55, -0.35], [0.0, -0.35], [0.0, 0.35]]"
      action_type: "stop"
      min_points: 2
      enabled: false

    observation_sources: ["lidar_scan", "front_pointcloud"]
    lidar_scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 2.0
      min_points: 3
      visualize: false
      enabled: true

    front_pointcloud:
      type: "pointcloud"
      topic: "/front_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.15
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: false

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [ 2.24, 0.0,  1.5]
    min_velocity: [-0.6,  0.0, -1.5]
    max_accel:    [ 1.5,  0.0,  1.5]
    max_decel:    [-2.0,  0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: base_link
      robot_base_frame: base_link
      update_frequency: 15.0
      publish_frequency: 10.0
      transform_tolerance: 1.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      # Live LaserScan obstacle layer.  Unlike a StaticLayer it does not wait
      # for an external map, so it never blocks the costmap from becoming
      # current.  expected_update_rate: 0.0 means the scan buffer is never
      # marked stale, so a missing /scan won't stall the costmap either.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.75

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 1.0
      rolling_window: true
      width: 100
      height: 100
      resolution: 0.10
      track_unknown_space: true
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      # Live LaserScan obstacle layer (see local_costmap note above).
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 1.00
