lane_segmentation_node:
  ros__parameters:
    # ── Camera configuration ────────────────────────────────────────
    # Segmentation (YOLOPv2) is run on the front ZED only — the side
    # cameras mostly look at grass and drain inference time for little
    # gain.  Set num_cameras > 1 and extend the lists to re-enable.
    num_cameras: 1
    camera_topics:
      - "/front_zed_camera_x/zed_node/rgb/color/rect/image"
    depth_topics:
      - "/front_zed_camera_x/zed_node/depth/depth_registered"
    camera_info_topics:
      - "/front_zed_camera_x/zed_node/rgb/color/rect/camera_info"

    # ── Frames ──────────────────────────────────────────────────────
    base_frame: "base_link"
    occupancy_grid_frame: "base_link"

    # ── Local rolling costmap ───────────────────────────────────────
    grid_resolution: 0.05
    grid_width:     20.0
    grid_height:    20.0

    # ── Region of interest / body cropping ──────────────────────────
    chassis_mask_frac: 0.15
    roi_bottom_frac:  0.95
    roi_top_frac:     0.55

    # ── Depth sampling ──────────────────────────────────────────────
    depth_scale: 1.0
    min_detection_depth_m: 0.5
    max_detection_depth_m: 20.0
    depth_search_radius_px: 2

    # ── Multi-camera fusion (single-camera for now, left in for future)
    fusion_timeout_sec: 0.5
    keep_last_grid_on_miss: true

    # ── Persistent (fixed-frame) lane map ───────────────────────────
    persistent_map_frame:      "map"
    persistent_map_size_m:    40.0
    persistent_map_resolution: 0.125
    persistent_map_decay:      0.998
    persistent_hit_weight:     4.0
    persistent_threshold:     15.0
    persistent_max_value:    200.0
    persistent_publish_hz:     2.0
    persistent_clear_radius_m: 0.8

    # ── YOLOPv2 segmentation model ──────────────────────────────────
    # model_weights is intentionally empty — the launch file fills it
    # in from $YOLOPV2_WEIGHTS or the model_weights launch argument so
    # the absolute path stays out of source control.
    model_weights: "/home/nitin/Documents/DevEnv/jazzy_ws/IGVC_robot_2026/models/yolopv2.pt"
    model_device:  "cuda:0"
    model_half:    true
    model_img_size: 640

    # Mask → point-cloud rasterisation
    da_subsample_px: 6             # drivable-area stride (cheap, dense)
    ll_subsample_px: 2             # lane-line stride (sparse, precise)
    min_lane_component_px: 150     # reject tiny speckles
    max_points_per_frame:  4000    # per-mask hard cap

    # ── Debug ───────────────────────────────────────────────────────
    publish_overlay: true
    lane_marker_topic: "/lane_segmentation/lanes"
