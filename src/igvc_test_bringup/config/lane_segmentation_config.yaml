lane_segmentation_node:
  ros__parameters:
    # ── Camera configuration ────────────────────────────────────────
    # The pointcloud_merger_node fuses all three ZED point clouds into a
    # single base_link cloud.  The lane detector still keeps one front RGB
    # subscription for sync/fallback overlay only; PC2 RGB drives detection.
    num_cameras: 1
    camera_topics:
      - "/zed/zed_node/rgb/color/rect/image"
      # - "/front_zed_camera_x/zed_node/rgb/color/rect/image"
      # - "/left_zed_camera_x/zed_node/rgb/color/rect/image"
      # - "/right_zed_camera_x/zed_node/rgb/color/rect/image"
    pc2_topics:
     - "/zed/zed_node/point_cloud/cloud_registered"
      # - "/zed/point_cloud/merged_registered"
      # - "/front_zed_camera_x/zed_node/point_cloud/cloud_registered"
      # - "/left_zed_camera_x/zed_node/point_cloud/cloud_registered"
      # - "/right_zed_camera_x/zed_node/point_cloud/cloud_registered"
    camera_info_topics:
      - "/zed/zed_node/rgb/color/rect/camera_info"
      # - "/front_zed_camera_x/zed_node/rgb/color/rect/camera_info"
      # - "/left_zed_camera_x/zed_node/rgb/color/rect/camera_info"
      # - "/right_zed_camera_x/zed_node/rgb/color/rect/camera_info"

    # ── Frames ──────────────────────────────────────────────────────
    base_frame: "zed_camera_link"
    occupancy_grid_frame: "zed_camera_link"

    # ── Local rolling costmap ───────────────────────────────────────
    grid_resolution: 0.05
    grid_width:     10.0
    grid_height:    10.0

    # ── Region of interest / body cropping ──────────────────────────
    # roi_enabled=false → use the full frame (matches the offline
    # bag-replay overlay which produced the cleanest masks).  Flip to
    # true to re-enable the trapezoidal crop defined by the two
    # *_frac params below.
    chassis_mask_frac: 0.15
    roi_enabled:      false
    roi_bottom_frac:  0.95
    roi_top_frac:     0.55

    # ── PC2 range gates ──────────────────────────────────────────────
    min_detection_depth_m: 0.3
    max_detection_depth_m: 5.0
    # ── Detection mode ───────────────────────────────────────────────
    # pc2_color_ground skips YOLOPv2 and uses the fused ZED PointCloud2:
    # lane = white/yellow ground-plane cloud points;
    # free = other ground-plane cloud points between the detected lines.
    # Set to "yolopv2" to return to the YOLOPv2 model-mask pipeline.
    # Set to "ufldv2" to use Ultra-Fast-Lane-Detection-v2 lane masks.
    detection_mode: "yolopv2"

    # Ground-plane gate in base_link Z.  Widen if the map reports color
    # pixels but drops them before projection; tighten if obstacle colors
    # leak into the lane map.
    pc2_ground_z_min_m: -0.35
    pc2_ground_z_max_m:  0.35
    pc2_lane_z_min_m:   -0.18
    pc2_lane_z_max_m:    0.18

    # Remove obstacle silhouettes from the PC2-only lane/free masks before
    # projection.  This prevents white/yellow barrels and their halos from
    # bleeding into /lane_map when obstacle clusters are dense.
    pc2_obstacle_exclusion_enabled: true
    pc2_obstacle_z_min_m:       0.12
    pc2_obstacle_z_max_m:       2.5
    pc2_obstacle_depth_min_m:   0.3
    pc2_obstacle_depth_max_m:   5.0
    pc2_obstacle_dilation_px:   10

    # PointCloud2 color gates in OpenCV HSV units (H: 0-179, S/V: 0-255).
    pc2_white_v_min: 180
    pc2_white_s_max: 90
    pc2_yellow_h_min: 12
    pc2_yellow_h_max: 45
    pc2_yellow_s_min: 45
    pc2_yellow_v_min: 110
    pc2_lane_morph_close_px: 3
    pc2_lane_subsample_px: 1

    # Free-space corridor fill.  For each forward-distance bin, the
    # detector estimates right/left lane boundaries from the lateral
    # spread of white/yellow points, then samples non-lane ground points
    # between those boundaries.
    pc2_free_subsample_px: 4
    pc2_free_bin_size_m: 0.25
    pc2_free_boundary_percentile: 10.0
    pc2_free_min_lane_points_per_bin: 4
    pc2_free_min_lane_width_m: 0.6
    pc2_free_max_lane_width_m: 6.0
    pc2_free_lane_margin_m: 0.10
    pc2_free_max_gap_m: 1.0
    pc2_free_single_boundary_enabled: true
    pc2_free_nominal_lane_width_m: 2.4
    pc2_free_single_boundary_min_abs_lat_m: 0.10

    # ── Multi-camera fusion ─────────────────────────────────────────
    # With 3 cameras and ~200 ms inference each, serial _model_lock
    # serialisation means camera states are up to 400 ms apart.
    # Set both limits to 0.8 s so all three cameras are inside the
    # fusion window when the last one finishes.
    max_time_offset_sec: 0.8
    fusion_timeout_sec: 0.8
    keep_last_grid_on_miss: true

    # ── Lane-line correlation / map alignment ───────────────────────
    # PC2 color-ground mode is cheap and synchronized, so write every
    # detection frame to /lane_map.  The old YOLO path used nonzero
    # dedup thresholds to avoid stacking slow repeated inferences.
    min_pose_change_m:   0.0
    min_pose_change_rad: 0.0

    # ── Persistent (fixed-frame) lane map ─────────────────────────────
    # Use odom frame (not map) so TF lookup goes directly to ZED odom
    # (~100 Hz) instead of through the EKF (30 Hz) — fixes the root cause
    # of lanes stacking at the same world position.
    persistent_map_frame:      "odom"
    persistent_pose_source:    "odom"
    odom_topic:                "/zed/zed_node/odom" # "/front_zed_camera_x/zed_node/odom"
    persistent_map_size_m:    100.0
    persistent_map_resolution: 0.20
    persistent_map_decay:      0.998
    persistent_hit_weight:     5.0
    persistent_free_hit_weight: 1.0
    persistent_threshold:     6.0
    persistent_free_threshold: 3.0
    persistent_max_value:    200.0
    persistent_publish_hz:     4.0
    persistent_clear_radius_m: 0.8
    persistent_publish_clear_robot: false
    persistent_skip_publish_without_subscribers: true
    local_costmap_from_persistent: true
    local_costmap_publish_hz: 10.0
    local_back_nogo_buffer_m: 0.30

    # ── Temporal lane filtering before /lane_costmap publish ───────
    # Per-cell EMA + hysteresis on lane occupancy to suppress one-frame
    # mask flicker before the local costmap is published.
    temporal_filter_enabled: false
    temporal_lane_rise_alpha: 0.60
    temporal_lane_fall_alpha: 0.35
    temporal_lane_unknown_decay: 0.08
    temporal_lane_on_threshold: 0.60
    temporal_lane_off_threshold: 0.45
    # Zero the EMA state if no frame applies the filter for this long
    # (seconds).  Prevents stale evidence from re-emerging through
    # hysteresis after a perception gap (dropped frames, mode switch,
    # robot teleport).  Set <= 0 to disable.
    temporal_reset_gap_sec: 1.0

    # 0 disables the yaw-rate write gate.  With PC2 color-ground mode we
    # do not have the YOLO latency that made this guard necessary.
    max_yaw_rate_for_persist_update_rad_s: 0.0

    # Keep the synchronizer latest-only so YOLO does not chew through
    # a backlog of old RGB+depth pairs when the camera out-runs inference.
    sync_queue_size: 1
    sync_slop_sec: 0.10
    # Jetson real-world pipeline latency is often 0.40-0.70s under YOLO load.
    # Keep latest-only queueing but allow those frames through.
    max_frame_age_sec: 2.0

    # ── YOLOPv2 segmentation model ──────────────────────────────────
    # Ignored while detection_mode is "pc2_color_ground".
    # model_weights is intentionally empty; pass model_weights:=... or
    # export $UFLDV2_WEIGHTS / $YOLOPV2_WEIGHTS for the selected
    # detection_mode so the absolute path stays out of source control.
    # TensorRT engine (FP16, built with trtexec --fp16 --onnx=yolopv2_384.onnx).
    # Extension .engine triggers the TRT backend in lane_segmentation.py.
    # To revert to TorchScript, point this at yolopv2.pt instead.
    # model_weights: "/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2_640x480.engine"
    model_weights: ""
    model_device:  "cuda:0"
    model_half:    true
    # Must match the --img-size used when building the engine (640x480).
    # Changing this without rebuilding the engine will crash at load time.
    model_img_size: 640

    # ── Ultra-Fast-Lane-Detection-v2 model ──────────────────────────
    # Set detection_mode: "ufldv2" and point model_weights at the .pth
    # checkpoint downloaded by scripts/fetch_ufldv2_weights.sh.
    # ufldv2_config may be absolute or relative to ufldv2_root.
    ufldv2_root: ""
    ufldv2_config: "configs/culane_res18.py"
    ufldv2_lane_width_px: 8
    ufldv2_drivable_fill: true
    ufldv2_drivable_lane_dilation_px: 45
    ufldv2_min_points_per_lane: 4
    ufldv2_refine_lane_mask: false
    # UFLDv2 predicts lane geometry even when the visible paint is weak.
    # Require projected lane pixels to sit near white/yellow ground-plane
    # paint before they can enter /lane_map; this removes structural false
    # positives that are nowhere close to the painted lines.
    ufldv2_paint_refine_enabled: true
    ufldv2_paint_refine_dilation_px: 15
    ufldv2_paint_refine_ground_gate: true
    ufldv2_paint_refine_min_component_px: 35
    # UFLDv2 can miss IGVC/sim frames even when the checkpoint is valid.
    # Keep the PC2 white/yellow ground-plane detector as a fallback so the
    # map does not go completely empty while diagnostics report the raw mask
    # and projection counts.
    model_pc2_fallback_enabled: true
    model_debug_stats: true

    # ── Preprocessor (CLAHE + Gaussian blur, applied before letterbox) ──
    # Aggressive values tuned for Isaac Sim domain gap:
    #   - CLAHE boosts contrast on the flat sim lighting / textureless ground
    #   - Blur suppresses high-frequency rendering artefacts that trigger
    #     false drivable-area and lane-line positives
    model_preprocess:  true
    model_clahe_clip:  2.0
    model_clahe_tile:  [8, 8]
    model_blur_ksize:  [5, 5]
    model_blur_sigma:  0.0

    # ── Post-processing cleanup (drivable-area mask) ─────────────────
    # Morphological open (erode then dilate) removes isolated speckles
    # that appear in sim but not on real roads.
    da_morph_kernel_px:   7
    min_da_component_px:  300      # drop DA blobs smaller than this (px)

    # Mask → point-cloud rasterisation.
    # The pipeline downstream of the model is now fully vectorised
    # (numpy gather + matmul instead of Python per-pixel loops), so we
    # can afford much denser sampling than the old defaults of 8/3.
    # Lowering these increases the number of free-space and lane points
    # that reach /lane_costmap and /lane_map.
    da_subsample_px: 8
    ll_subsample_px: 1
    # Lowered from 150 → 60 px: the 150 threshold was silently dropping
    # thin / far-field lane evidence (dashed markings, oblique cameras)
    # producing visually-correct overlays but a near-empty /lane_map.
    min_lane_component_px: 3
    max_points_per_frame:  10000    # per-mask hard cap

    # Lane mask dilation after UFLDv2/YOLO cleanup. Keep this modest: large
    # kernels amplify single bad lane pixels into map-visible false lanes.
    ll_dilation_px: 9

    # Local /lane_costmap lane (100) inflation radius in metres.
    # Inflates cleaned lane cells only enough to keep the corridor readable.
    local_lane_inflation_m: 0.30

    # ── Debug ───────────────────────────────────────────────────────
    publish_overlay: false
    lane_marker_topic: "/lane_segmentation/lanes"

    # ── Lane-line refinement (paint-only filter) ────────────────────
    # YOLOPv2's lane-line head is trained on driving data and fires on
    # more than just painted lines — in particular it tags road edges /
    # asphalt-grass boundaries / curbs as "lane lines".  IGVC tracks have
    # only painted *white* lines, so we reject everything else with a
    # two-stage gate:
    #   (a) lane_in_drivable_only  → keep ll_mask cells inside (or near)
    #       the drivable-area mask.  Drops curb / off-road false positives.
    #   (b) lane_color_filter_*    → keep only pixels that look white-painted
    #       in HSV (high V, low S).  Drops the asphalt-grass texture line.
    # `lane_threshold` lowers the per-pixel confidence cutoff on the head
    # (default torch.round = 0.5) so faint thin paint is recovered.
    # `lane_morph_close_px` bridges 1-2 px gaps along thin lines so the
    # min_lane_component_px filter does not reject dashed segments.
    lane_threshold:               0.35
    lane_in_drivable_only:        true
    lane_da_dilate_px:            30
    lane_color_filter_enabled:    true
    lane_color_v_min:             170    # HSV V ≥ this → bright enough
    lane_color_s_max:             70     # HSV S ≤ this → low saturation (white)
    lane_morph_close_px:          3

    # ── Classical white-paint augmentation (thin-line recovery) ─────
    # IRL IGVC paint is 0.5–2 inches wide vs sim 4 inches; the model
    # often misses these even at lower `lane_threshold`.  Enable this to
    # ADD bright white-paint pixels (gated by drivable area + color) to
    # the lane mask, supplementing the model.  Off in sim where the wider
    # lines already trigger the head reliably; flip to true on hardware.
    lane_color_augment_enabled:       false
    lane_color_augment_v_min:         200   # stricter than the filter gate
    lane_color_augment_s_max:         50
    lane_color_augment_min_area_px:   25

    # ── Canny white-edge augmentation ────────────────────────────────
    # Runs Canny edge detection on the grayscale image inside the
    # drivable area, then keeps only edges that also pass an HSV white-
    # paint gate.  The surviving edges are OR-ed into the lane mask so
    # thin lines that YOLOPv2 missed (but have a clear brightness edge)
    # still reach the costmap.  Safe to enable alongside
    # lane_color_augment_enabled — they are additive.
    #
    # Tune lane_canny_low / lane_canny_high for the scene contrast:
    #   - lower  = more sensitive, more noise
    #   - higher = cleaner but may miss faint paint
    # lane_canny_dilate_px thickens each detected edge before merging so
    # single-pixel Canny responses project as small regions, not points.
    lane_canny_augment_enabled:   false  # disabled: not validated on real hardware
    lane_canny_low:               30    # Canny lower hysteresis threshold
    lane_canny_high:              100   # Canny upper hysteresis threshold
    lane_canny_v_min:             170   # HSV V ≥ this (same as color filter)
    lane_canny_s_max:             70    # HSV S ≤ this (same as color filter)
    lane_canny_dilate_px:         5     # edge thickening before merge (px)

    # ── Ground-plane projection (experimental, gated) ────────────────
    # Fits a RANSAC plane to the ROI'd PC2 in base_link each frame, then
    # uses ray–plane intersection to recover (fwd, lat) for mask pixels.
    # Modes:
    #   off      : disabled — current behaviour, projection uses per-pixel PC2 z
    #   fallback : use PC2 z first; fill NaN pixels with ray–plane only
    #   force    : always ray–plane (ignore per-pixel PC2 z)
    # Recommended first test: 'fallback'.
    ground_plane_projection_mode: "off"
    ground_plane_ransac_iters:    60
    ground_plane_inlier_thresh_m: 0.05
    ground_plane_roi_fwd_min_m:   1.0
    # fwd_max/z_abs widened from 12.0/0.30 so the same RANSAC fit also serves
    # ramp detection: at 15° the surface rises ~0.27 m per metre forward, so a
    # 0.30 m z band would clip the ramp face out of the ROI.  6 m forward x
    # 1.5 m z captures the approach + ramp without pulling in tall obstacles
    # (the z-normal gate + 0.05 m inlier band still lock onto the ground).
    ground_plane_roi_fwd_max_m:   6.0
    ground_plane_roi_lat_abs_m:   2.0
    ground_plane_roi_z_abs_m:     1.5
    ground_plane_min_inliers:     200
    ground_plane_min_z_normal:    0.7
    ground_plane_ema_alpha:       0.3      # 0=hold previous, 1=use new fit
    ground_plane_max_sample_pts:  5000

    # ── Ramp / slope detection ───────────────────────────────────────
    # Publishes forward terrain slope + fall-line heading on ramp_status_topic
    # (geometry_msgs/Vector3Stamped: x=slope_deg, y=fall_line_yaw_rad,
    # z=confidence) for mission_planner_node's ramp_align/ramp_climb states.
    ramp_detect_enabled: true
    ramp_status_topic:   "/ramp/state"
    ramp_min_period_sec: 0.2

    # ── Plane-based height obstacle gate (requires plane mode != off) ─
    # Drops mask pixels whose true height above the fitted ground plane
    # exceeds the threshold.  Adapts to terrain pitch and camera drift.
    plane_height_gate_enabled:    false
    plane_height_gate_thresh_m:   0.10
    plane_height_gate_dilate_px:  15

    # ── Per-component lane curve fitting ─────────────────────────────
    # Fits lat = poly(fwd) to each connected lane component in base_link
    # and replaces the raw scatter with samples along the curve.  Keeps
    # the original component when the fit residual exceeds the cap so
    # smoothing can only improve, never delete data.
    lane_curve_fit_enabled:       false
    lane_curve_poly_order:        2        # 1=line, 2=quadratic, 3=cubic
    lane_curve_min_points:        10
    lane_curve_sample_step_m:     0.10
    lane_curve_max_residual_m:    0.30     # reject fit above this RMSE
    lane_curve_extend_to_robot:   false
    lane_curve_extend_forward_m:  0.0      # 0 disables forward extrapolation

    # ── Confidence-weighted persistent-map writes ────────────────────
    # Per-point write scale = base_weight * w, where w grows with the
    # connected-component size that produced the point (large blobs are
    # more likely to be real paint than specks).  No effect unless
    # enabled; original behaviour is w = 1 for every point.
    confidence_weighted_writes_enabled: false
    confidence_min_weight:        0.3      # clamp floor (0.05–1.0)
    confidence_component_full_px: 400      # component size that hits w=1

    # ── Depth-based obstacle masking ─────────────────────────────────
    # After YOLOPv2 inference, pixels whose 3-D base_link height lands in the
    # obstacle band are zeroed out of both the drivable-area and lane-line masks.
    # This prevents the model from hallucinating lane lines over barrels / cones.
    #
    # Tune obstacle_z_min_m upward if ground reflections still trigger false mask.
    # Tune obstacle_dilation_px upward if silhouette halo edges remain visible.
    obstacle_mask_enabled:    true
    obstacle_z_min_m:         0.10    # base_link Z above this → obstacle (not ground)
    obstacle_z_max_m:         2.5     # above this → sky/ceiling, ignore
    obstacle_depth_min_m:     0.3     # ignore very-close depth noise
    obstacle_depth_max_m:     6.0     # ignore distant background objects
    obstacle_dilation_px:     20      # expand mask to cover halo / shadow edges
    camera_height_fallback_m: 0.25    # approximate camera mount height (fallback only)
