# ZED2i override config for IGVC YOLOv12 custom object detection
# This config enables object detection and points to the IGVC-trained custom ONNX model.
# Base this on common_stereo.yaml but override only the OD-specific parameters.

/**:
  ros__parameters:
    object_detection:
      od_enabled: true  # Enable object detection
      model: 'CUSTOM_YOLOLIKE_BOX_OBJECTS'  # Use custom YOLO-like ONNX model
      custom_onnx_file: ''  # Path to ONNX file (can be set via launch argument or environment)
      custom_onnx_input_size: 512  # Input tensor size: 1x3x512x512
      custom_class_count: 15  # Number of classes in the IGVC YOLOv12 model
      allow_reduced_precision_inference: true
      max_range: 20.0  # Maximum detection range in meters
      confidence_threshold: 50.0  # Minimum detection confidence [0, 99]
      prediction_timeout: 0.5  # Tracking prediction timeout in seconds
      enable_tracking: true  # Enable object tracking across frames
      filtering_mode: '1'  # '1' = NMS3D

      # IGVC YOLOv12 class definitions
      class_000:
        label: '3'
        model_class_id: 0
        enabled: true
        confidence_threshold: 50.0
        is_grounded: false
        is_static: false

      class_001:
        label: 'Tire'
        model_class_id: 1
        enabled: true
        confidence_threshold: 50.0
        is_grounded: true
        is_static: true

      class_002:
        label: 'pedestrianCrossing'
