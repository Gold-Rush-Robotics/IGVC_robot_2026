controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # Thresholds below which the robot is considered stationary.
    # Keep these small — 0.5 was incorrectly high and prevented progress detection.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true   # <-- stateful belongs HERE on goal_checker, not on the controller plugin

    # Nav2 Jazzy: RegulatedPurePursuitController parameter names changed.
    # max_linear_vel -> desired_linear_vel
    # min/max_angular_vel, accel/decel params -> removed (use velocity_smoother)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5               # was max_linear_vel — renamed in Jazzy
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0
      # Removed from Jazzy RPPC (were causing SIGABRT):
      #   min_linear_vel, max/min_angular_vel
      #   max_linear_accel/decel, max_angular_accel/decel
      #   use_dynamic_window, stateful, min_distance_to_obstacle

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/diff_drive_controller/cmd_vel_unstamped"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["front_pointcloud", "left_pointcloud", "right_pointcloud"]
    front_pointcloud:
      type: "pointcloud"
      topic: "/front_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.05
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: true
    left_pointcloud:
      type: "pointcloud"
      topic: "/left_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.05
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: true
    right_pointcloud:
      type: "pointcloud"
      topic: "/right_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.05
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Velocity/accel limits now live here, not in the controller plugin
    max_velocity: [ 0.5,  0.0,  2.5]
    min_velocity: [-0.5,  0.0, -2.5]
    max_accel:    [ 2.5,  0.0,  3.2]
    max_decel:    [-2.5,  0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12    # integer in Jazzy — meters / resolution = cell count
      height: 12
      resolution: 0.05
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "front_pointcloud left_pointcloud right_pointcloud"
        front_pointcloud:
          topic: /front_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
        left_pointcloud:
          topic: /left_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
        right_pointcloud:
          topic: /right_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 20    # integer in Jazzy
      height: 20
      resolution: 0.10
      track_unknown_space: false
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "front_pointcloud left_pointcloud right_pointcloud"
        front_pointcloud:
          topic: /front_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
        left_pointcloud:
          topic: /left_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
        right_pointcloud:
          topic: /right_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8