# ──────────────────────────────────────────────────────────────────────────────
#  Nav2 params for IGVC AutoNav
#  Key additions vs previous version:
#    1. bt_navigator + waypoint_follower  (drives GPS waypoint loop)
#    2. lane_layer added to local costmap (static layer fed by /lane_costmap)
#    3. planner_server using SmacPlanner2D (better for tight obstacle avoidance)
# ──────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false    # keep going to next waypoint even if one fails
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0   # no pause needed for IGVC

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5                   # goal tolerance (m) — generous for GPS accuracy
      downsample_costmap: true
      downsampling_factor: 1
      allow_unknown: true              # needed: unknown cells exist at course edges
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # Do NOT zero small commands — that causes bang-bang around zero and snaking.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0   # longer: course has tight spots

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5          # GPS is ~1-2m accuracy outdoors
      yaw_goal_tolerance: 0.5
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 2.24        # 5 mph target
      # Cap angular output — stops the large swings the smoother was tracking.
      desired_angular_vel: 1.2
      # Longer lookahead (and velocity-scaled) gives a smoother carrot and
      # stops high-frequency angular oscillation.  Scaled up for higher speed.
      lookahead_dist: 2.2
      min_lookahead_dist: 1.2
      max_lookahead_dist: 3.5
      lookahead_time: 1.8
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      # Smooth curvature regulation — prefer lower gain so we don't chatter.
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 1.2
      # Cost regulation off: jittery lane-costmap near the footprint was
      # causing linear.x to collapse to 0 and angular to spike (snake).
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.35
      # Disable in-place heading rotations during path following — the big
      # angular pulses in the cmd_vel log were triggered by this.
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 1.57
      max_robot_pose_search_dist: 10.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/diff_drive_controller/cmd_vel_unstamped"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 2.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["SlowZone", "StopZone"]

    # Slow to 50% when anything enters 1.0m ahead
    SlowZone:
      type: "polygon"
      action_type: "slowdown"
      polygon_sub_topic: "/collision_monitor/slow_zone"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      enabled: false

    # Hard stop if anything enters 0.4m
    StopZone:
      type: "polygon"
      action_type: "stop"
      polygon_sub_topic: "/collision_monitor/stop_zone"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.8
      simulation_time_step: 0.1
      min_points: 4
      visualize: true
      enabled: false

    observation_sources: ["front_pointcloud", "left_pointcloud", "right_pointcloud"]
    front_pointcloud:
      type: "pointcloud"
      topic: "/front_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.05
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: true
    left_pointcloud:
      type: "pointcloud"
      topic: "/left_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.05
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: true
    right_pointcloud:
      type: "pointcloud"
      topic: "/right_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.05
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"
    # Scale linear/angular together so we never get the "high angular + low
    # linear" pattern that produces tight in-place snakes.
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [ 2.24, 0.0,  1.5]   # 5 mph forward cap
    min_velocity: [-0.2,  0.0, -1.5]
    # Accel limits sized so the robot can reach 2.24 m/s in ~1.5 s.
    max_accel:    [ 1.5,  0.0,  1.5]
    max_decel:    [-2.0,  0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ──────────────────────────────────────────────────────────────────────────────
#  Local costmap
#  Three layers in priority order:
#    1. obstacle_layer  — ZED pointclouds mark/clear physical obstacles
#    2. lane_layer      — your /lane_costmap marks lane lines as lethal
#    3. inflation_layer — inflates all obstacles by robot radius + margin
# ──────────────────────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "lane_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 1.0
        observation_sources: "front_pointcloud left_pointcloud right_pointcloud"
        front_pointcloud:
          topic: /front_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.3
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
        left_pointcloud:
          topic: /left_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.3
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
        right_pointcloud:
          topic: /right_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.3
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0

      # Lane lines from the persistent fixed-frame map (/lane_map).
      # Using the persistent map (not the rolling /lane_costmap) avoids the
      # StaticLayer "Resizing static layer" storm that happens when a rolling
      # grid's origin shifts every tick — which was starving the planner
      # and causing NavigateToPose goals to abort immediately.
      lane_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        map_topic: "/lane_map"
        lethal_cost_threshold: 90
        unknown_cost_value: 1
        track_unknown_space: false
        use_maximum: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.0               # 0.35m robot half-width + 0.35m margin

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.10
      track_unknown_space: false
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 1.0
        observation_sources: "front_pointcloud left_pointcloud right_pointcloud"
        front_pointcloud:
          topic: /front_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.3
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
        left_pointcloud:
          topic: /left_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.3
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
        right_pointcloud:
          topic: /right_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.3
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.9