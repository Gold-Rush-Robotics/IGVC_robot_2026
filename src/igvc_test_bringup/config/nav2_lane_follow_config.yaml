# ──────────────────────────────────────────────────────────────────────────────
#  Nav2 params for IGVC AutoNav
#  Key additions vs previous version:
#    1. bt_navigator + waypoint_follower  (drives GPS waypoint loop)
#    2. lane_layer added to local costmap (static layer fed by /lane_costmap)
#    3. planner_server using SmacPlanner2D (better for tight obstacle avoidance)
# ──────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 1.0
    default_nav_to_pose_bt_xml: ""

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false    # keep going to next waypoint even if one fails
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0   # no pause needed for IGVC

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0  # raised from 5.0 — matches 20 Hz controller 2:1 instead of 4:1
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.3                   # goal tolerance (m) — tighter for precise lane following
      downsample_costmap: true
      downsampling_factor: 1
      allow_unknown: false             # GT lane map uses unknown outside the corridor; stay inside the lines
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5           # allow SmacPlanner2D to route around obstacles inside curves
      cost_travel_multiplier: 6.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # Nav2 Jazzy defaults this to 0.30 s; with 3 pointcloud observation
    # sources plus the large /lane_map StaticLayer the local costmap
    # occasionally takes much longer than that to republish, so we give
    # it several seconds of headroom before aborting the goal.
    costmap_update_timeout: 5.0
    # Do NOT zero small commands — that causes bang-bang around zero and snaking.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Very lenient so MPPI warm-up / brief stalls near lane paint
      # don't abort the goal.  Lane-following courses may legitimately
      # need >15 s to squeeze past tight features.
      required_movement_radius: 0.1
      movement_time_allowance: 45.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5          # GPS is ~1-2m accuracy outdoors
      yaw_goal_tolerance: 0.5
      stateful: true

    FollowPath:
      # MPPI proved too brittle with the current fused costmap: the
      # planner kept producing valid paths, but MPPI rejected every local
      # rollout and churned in an optimizer-reset loop.  RPP is far more
      # tolerant of sparse / noisy lane updates while still benefiting
      # from the 5 Hz global replanning above.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.90
      desired_angular_vel: 1.5
      lookahead_dist: 1.2
      min_lookahead_dist: 0.6
      max_lookahead_dist: 2.4
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 1.5
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 1.0
      # The local obstacle layer is currently too noisy for RPP's internal
      # forward collision projection, which was repeatedly declaring open
      # space blocked.  Keep collision_monitor active for the hard stop and
      # let global planning + lane costs steer around obstacles.
      # Disabled: with lane lines as lethal costs in the local costmap, RPP's
      # forward collision projection was treating inflated lane paint as an
      # obstacle and aborting or stalling path tracking.  The collision_monitor
      # (pointcloud-based) still handles hard stops for physical obstacles.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 1.0
      use_cost_regulated_linear_velocity_scaling: true
      # Match the local inflation radius so the robot slows as it enters the
      # same safety field the controller is tracking.  This keeps obstacle
      # avoidance from becoming a late, sharp maneuver near cones/barrels.
      cost_scaling_dist: 0.50
      cost_scaling_gain: 2.0
      regulated_linear_scaling_min_radius: 1.2
      regulated_linear_scaling_min_speed: 0.35
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 1.57
      max_robot_pose_search_dist: 2.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/diff_drive_controller/cmd_vel_unstamped"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 1.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["SlowZone", "StopZone"]

    # Slow to 50% when anything enters 1.0m ahead
    # SlowZone:
    #   type: "polygon"
    #   action_type: "slowdown"
    #   polygon_sub_topic: "/collision_monitor/slow_zone"
    #   footprint_topic: "/local_costmap/published_footprint"
    #   time_before_collision: 2.0
    #   simulation_time_step: 0.1
    #   min_points: 4
    #   slowdown_ratio: 0.5
    #   visualize: true
    #   enabled: false

    # # Hard stop if anything enters 0.4m
    # StopZone:
    #   type: "polygon"
    #   action_type: "stop"
    #   polygon_sub_topic: "/collision_monitor/stop_zone"
    #   footprint_topic: "/local_costmap/published_footprint"
    #   time_before_collision: 0.8
    #   simulation_time_step: 0.1
    #   min_points: 4
    #   visualize: true
    #   enabled: false


    SlowZone:
      type: "polygon"
      points: "[[1.0, 0.5], [1.0, -0.5], [0.0, -0.5], [0.0, 0.5]]"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 2
      enabled: true
    StopZone:
      type: "polygon"
      points: "[[0.55, 0.4], [0.55, -0.4], [0.0, -0.4], [0.0, 0.4]]"
      action_type: "stop"
      min_points: 2
      enabled: true

    observation_sources: ["front_pointcloud"]
    front_pointcloud:
      type: "pointcloud"
      topic: "/front_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.15
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: false
    left_pointcloud:
      type: "pointcloud"
      topic: "/left_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.15
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: false
    right_pointcloud:
      type: "pointcloud"
      topic: "/right_zed_camera_x/zed_node/point_cloud/cloud_registered"
      min_obstacle_height: 0.15
      max_obstacle_height: 2.0
      min_obstacle_points: 3
      visualize: false
      enabled: false

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"
    # Scale linear/angular together so we never get the "high angular + low
    # linear" pattern that produces tight in-place snakes.
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [ 2.24, 0.0,  1.5]   # 5 mph forward cap
    min_velocity: [-0.2,  0.0, -1.5]
    # Accel limits sized so the robot can reach 2.24 m/s in ~1.5 s.
    max_accel:    [ 1.5,  0.0,  1.5]
    max_decel:    [-2.0,  0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ──────────────────────────────────────────────────────────────────────────────
#  Local costmap
#  Three layers in priority order:
#    1. obstacle_layer  — ZED pointclouds mark/clear physical obstacles
#    2. lane_layer      — your /lane_costmap marks lane lines as lethal
#    3. inflation_layer — inflates all obstacles by robot radius + margin
# ──────────────────────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 10.0  # raised from 5.0 — now publishes every update instead of discarding half
      transform_tolerance: 1.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "lane_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 1.0
        footprint_clearing_enabled: true
        observation_sources: "front_pointcloud left_pointcloud right_pointcloud lidar_scan"
        # 2-D 360° LiDAR (sllidar / RPLIDAR).  LaserScan sees thin
        # obstacles (cones, poles, fence posts) the ZED depth smears
        # away, and its long raytrace range quickly clears stale
        # marks the cameras can't see behind/around the robot.
        lidar_scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
          raytrace_max_range: 12.0
          raytrace_min_range: 0.15
          inf_is_valid: true
        front_pointcloud:
          topic: /front_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.75
          raytrace_max_range: 10.0
          raytrace_min_range: 0.75
        left_pointcloud:
          topic: /left_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.75
          raytrace_max_range: 10.0
          raytrace_min_range: 0.75
        right_pointcloud:
          topic: /right_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.75
          raytrace_max_range: 10.0
          raytrace_min_range: 0.75

      # Lane lines from the persistent fixed-frame map (/lane_map).
      # Using the persistent map (not the rolling /lane_costmap) avoids the
      # StaticLayer "Resizing static layer" storm that happens when a rolling
      # grid's origin shifts every tick — which was starving the planner
      # and causing NavigateToPose goals to abort immediately.
      #
      # NOTE: lethal_cost_threshold is set ABOVE 100 so lane cells come in
      # as high-cost (253) rather than lethal (254).  With MPPI, lethal
      # cells cause every rollout that touches paint to be rejected, which
      # deadlocks the optimiser on narrow lanes.  High-cost still steers
      # the robot away strongly via CostCritic + PathAlignCritic.
      lane_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        map_topic: "/lane_map"
        lethal_cost_threshold: 90
        unknown_cost_value: 255
        track_unknown_space: true
        use_maximum: true
        trinary_costmap: false

      # Reduced from 0.75m: IGVC lane separation is ~2.4m and the robot is
      # 1.0m wide.  With inflation_radius=0.75, both sides inflated to
      # 2*0.75=1.5m, leaving only 0.9m of free space — narrower than the
      # robot.  0.50m still leaves ~1.4m of usable corridor while pushing
      # obstacle avoidance earlier than the previous 0.40m setting.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.50

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0   # raised from 2.0 — 500ms global map staleness → 200ms
      publish_frequency: 5.0  # raised from 1.0 — was discarding 4 of every 5 updates
      transform_tolerance: 1.0
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.10
      track_unknown_space: true
      footprint: "[[0.50, 0.35], [0.50, -0.35], [-0.50, -0.35], [-0.50, 0.35]]"
      plugins: ["obstacle_layer", "lane_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 1.0
        footprint_clearing_enabled: true
        observation_sources: "front_pointcloud left_pointcloud right_pointcloud lidar_scan"
        # 2-D 360° LiDAR — same rationale as the local costmap, but with
        # the global costmap's longer ranges to match the 30×30 m window.
        lidar_scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.15
          raytrace_max_range: 15.0
          raytrace_min_range: 0.15
          inf_is_valid: true
        front_pointcloud:
          topic: /front_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.75
          raytrace_max_range: 12.0
          raytrace_min_range: 0.75
        left_pointcloud:
          topic: /left_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.75
          raytrace_max_range: 12.0
          raytrace_min_range: 0.75
        right_pointcloud:
          topic: /right_zed_camera_x/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.75
          raytrace_max_range: 12.0
          raytrace_min_range: 0.75
      lane_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        map_topic: "/lane_map"
        lethal_cost_threshold: 90
        unknown_cost_value: 255
        track_unknown_space: true
        use_maximum: true
        trinary_costmap: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 0.50