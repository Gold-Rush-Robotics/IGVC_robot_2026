teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: false
    publish_stamped_twist: true
    axis_linear:  # Left thumb stick vertical
      x: 1
    scale_linear:
      x: 4.0 #2.2352

    axis_angular:  # Left thumb stick horizontal
      yaw: 3
    scale_angular:
      yaw: 15.0 #10.0

