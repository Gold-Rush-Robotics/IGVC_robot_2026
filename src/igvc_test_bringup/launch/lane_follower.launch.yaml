launch:
  - node:
      pkg: igvc_lane_detection
      exec: lane_detection_node
      name: lane_detection_node
      output: screen
      env:
        - name: PYTHONNOUSERSITE
          value: '1'
      param:
        - name: use_sim_time
          value: true
        - from: $(find-pkg-share igvc_test_bringup)/config/lane_detection_config.yaml

  - node:
      pkg: tf2_ros
      exec: static_transform_publisher
      name: map_to_odom_tf
      output: screen
      args: "0 0 0 0 0 0 map odom"

  # Launch nav2 with lane follow config
  - include:
      file: $(find-pkg-share igvc_test_bringup)/launch/navigation_no_docking.launch.py
      arg:
        - name: params_file
          value: $(find-pkg-share igvc_test_bringup)/config/nav2_lane_follow_config.yaml
        - name: use_sim_time
          value: 'true'