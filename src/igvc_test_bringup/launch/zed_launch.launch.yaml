launch:
- include:
    file: $(find-pkg-share zed_wrapper)/launch/zed_camera.launch.py
    arg:
      - name: camera_name
        value: left_zed_camera_x
      - name: camera_model
        value: zedx

- include:
    file: $(find-pkg-share zed_wrapper)/launch/zed_camera.launch.py
    arg:
      - name: camera_name
        value: front_zed_camera_x
      - name: camera_model
        value: zedx

- include:
    file: $(find-pkg-share zed_wrapper)/launch/zed_camera.launch.py
    arg:
      - name: camera_name
        value: right_zed_camera_x
      - name: camera_model
        value: zedx