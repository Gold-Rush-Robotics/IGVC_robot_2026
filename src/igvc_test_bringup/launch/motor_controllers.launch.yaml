launch:
  - arg:
      name: use_sim_time
      default: 'true'

  # Robot State Publisher
  - node:
      pkg: robot_state_publisher
      exec: robot_state_publisher
      name: robot_state_publisher
      output: screen
      param:
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: robot_description 
          value: $(command 'xacro $(find-pkg-share igvc_test_description)/urdf/robots/test_robot.urdf.xacro')
  # ROS2 Control Node
  - node:
      pkg: controller_manager
      exec: ros2_control_node
      name: controller_manager
      output: screen
      param:
        - name: use_sim_time
          value: $(var use_sim_time)
        - from: $(find-pkg-share igvc_test_bringup)/config/controllers.yaml

  # Joint State Broadcaster Spawner
  - node:
      pkg: controller_manager
      exec: spawner
      name: joint_state_broadcaster_spawner
      args: joint_state_broadcaster --controller-manager /controller_manager

  # Diff Drive Controller Spawner
  - node:
      pkg: controller_manager
      exec: spawner
      name: diff_drive_spawner
      args: diff_drive_controller --controller-manager /controller_manager
  
  - node:
      pkg: twist_stamper
      exec: twist_stamper
      name: twist_stamper_node
      output: screen
      param:
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: cmd_vel_in
          to: /diff_drive_controller/cmd_vel_unstamped
        - from: cmd_vel_out
          to: /diff_drive_controller/cmd_vel

