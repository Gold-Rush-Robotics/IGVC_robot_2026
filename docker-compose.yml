services:
  igvc_dev_zed:
    image: ghcr.io/gold-rush-robotics/dev-zed:5.1.0-13.0.0
    container_name: igvc_dev_zed
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    runtime: nvidia
    gpus: all
    ipc: host
    pid: host
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - /tmp:/tmp
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - FASTDDS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - uid=1000
      - gid=1000
    command: >-
      /bin/bash -lc "
      cp -f /root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/common_stereo_sim.yaml
      /root/ros2_ws/src/zed-ros2-wrapper/zed_wrapper/config/common_stereo.yaml
      && source /opt/ros/jazzy/setup.bash
      && rm -rf build/igvc_test_bringup install/igvc_test_bringup
      && colcon build --symlink-install --packages-select igvc_test_bringup --paths /root/ros2_ws/src/IGVC_robot_2026/src/*
      && source /root/ros2_ws/install/setup.bash
      && ./src/IGVC_robot_2026/scripts/use_igvc_dds.sh
      && ros2 launch igvc_test_bringup zed_simulation_launch.launch.yaml use_sim_time:=true
      "
      # && ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zedx"

