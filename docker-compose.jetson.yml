  #     - /bin/bash
  #     - -lc
  #     - |
  #       set -e
  #       source /opt/ros/humble/setup.bash
  #       colcon build --symlink-install \
  #         --base-paths /root/ros2_ws/src/IGVC_robot_2026/src \
  #         --cmake-args -DCMAKE_BUILD_TYPE=Release
  #       source /root/ros2_ws/install/setup.bash
  #       /bin/bash
  #       # ros2 launch igvc_test_bringup igvc_fused_drive.launch.py \
  #       #   hardware_interface:=ODriveHardware \
  #       #   use_sim_time:=false

volumes:
  # ZED area-memory: per-camera loop-closure databases survive container
  # lifecycle and host reboots unless this Docker volume is removed.
  zed_area_memory:

  # Colcon build caches — dramatically speed up incremental builds
  jetson_zed_build:
  jetson_zed_install:
  jetson_zed_log:
  jetson_stack_build:
  jetson_stack_install:
  jetson_stack_log:
