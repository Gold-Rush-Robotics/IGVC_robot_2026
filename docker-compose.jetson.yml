# docker-compose.jetson.yml
# Full IGVC stack for Jetson Orin AGX — JetPack 6.x / L4T r36 (arm64).
#
# Two services mirror the x86 docker-compose.yml layout:
#   igvc_jetson_zed        — ROS 2 Jazzy + ZED SDK 5 (zed-ros2-wrapper)
#                            Connects to 3x ZED X cameras via GMSL2 (Argus)
#   igvc_jetson_stack      — ROS 2 Humble drive/nav stack
#                            ODrive motor control, lane detection, Nav2
#
# Both containers share the host network and the same FastDDS UDP profile so
# they form a single ROS graph (identical to the x86 dev setup).
#
# Usage:
#   docker compose -f docker-compose.jetson.yml up
#   docker compose -f docker-compose.jetson.yml up igvc_jetson_zed   # cameras only
#
# IMPORTANT — Jetson-specific prerequisites:
#   1. nvidia-container-toolkit installed and configured (JetPack 6 includes it)
#   2. GMSL2 cameras powered and MIPI/GMSL2 kernel driver loaded before `up`
#   3. Set ROS_DOMAIN_ID env var if sharing the ROS graph over LAN
#   4. For persistent ZED area-memory across reboots, mount a volume at
#      /tmp/zed_area_memory (see zed service volumes below)

x-ros-common: &ros-common
  stdin_open: true
  tty: true
  privileged: true          # Required for GMSL2 kernel access on Jetson
  network_mode: host        # Share ROS graph with host and other containers
  restart: unless-stopped
  environment: &ros-env
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    - FASTDDS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
    - FASTRTPS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - ROS_LOCALHOST_ONLY=0

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Service 1: ZED X cameras — ROS 2 Jazzy + ZED SDK 5 on L4T r36
  # Runs zed_multi_real.launch.py → 3 camera nodes + EKF odometry fusion
  # ─────────────────────────────────────────────────────────────────────────
  igvc_jetson_zed:
    # Official Stereolabs image built for L4T r36 (JetPack 6.x, arm64).
    # Includes: ZED SDK 5, CUDA 12, TensorRT, ROS 2 Jazzy, zed-ros2-wrapper.
    image: stereolabs/zed:5.1.0-ros2-jazzy-l4t36
    container_name: igvc_jetson_zed
    <<: *ros-common
    runtime: nvidia           # JetPack 6 nvidia-container-toolkit syntax (no gpus: key needed)
    volumes:
      # Workspace source (bind mount — same as x86 compose)
      - .:/root/ros2_ws/src/IGVC_robot_2026

      # Argus socket — required for ZED X GMSL2 cameras on Jetson
      - /tmp/argus_socket:/tmp/argus_socket

      # System device access (GMSL2 device nodes, USB fallback, ZED Explorer)
      - /dev:/dev
      - /dev/shm:/dev/shm

      # Display forwarding (optional — for ZED Explorer / RViz on Jetson)
      - /tmp/.X11-unix:/tmp/.X11-unix

      # ZED area-memory persistence across container restarts.
      # Bind-mount a host directory here for cross-boot persistence, e.g.:
      #   - /opt/igvc/zed_area_memory:/tmp/zed_area_memory
      # Default: named volume (survives container rm; lost on volume rm)
      - zed_area_memory:/tmp/zed_area_memory

      # Per-service colcon caches (speeds up iterative builds)
      - jetson_zed_build:/root/ros2_ws/build
      - jetson_zed_install:/root/ros2_ws/install
      - jetson_zed_log:/root/ros2_ws/log

    environment:
      <<: *ros-env
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1

    command: >-
      /bin/bash -lc "
      set -e &&
      source /opt/ros/jazzy/setup.bash &&
      colcon build --symlink-install
        --base-paths /root/ros2_ws/src/IGVC_robot_2026/src
        --packages-select igvc_test_bringup
        --cmake-args -DCMAKE_BUILD_TYPE=Release &&
      source /root/ros2_ws/install/setup.bash &&
      ros2 launch igvc_test_bringup zed_multi_real.launch.py
      "

  # ─────────────────────────────────────────────────────────────────────────
  # Service 2: Drive + perception + navigation — ROS 2 Humble
  # ODrive motor control, lane detection (YOLOPv2), Nav2
  # Depends on igvc_jetson_zed for /odom and camera topics.
  # ─────────────────────────────────────────────────────────────────────────
  igvc_jetson_stack:
    build:
      context: .
      dockerfile: docker/Dockerfile.humble-fused-drive
      # The Dockerfile must be buildable for linux/arm64.
      # If the image is pre-built for arm64, replace `build:` with:
      #   image: igvc-humble-fused-drive:jetson-latest
    image: igvc-humble-fused-drive:jetson-latest
    container_name: igvc_jetson_stack
    <<: *ros-common
    runtime: nvidia
    working_dir: /root/ros2_ws
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix

      # Model weights
      - ./models:/root/ros2_ws/src/IGVC_robot_2026/models:ro

      # Separate colcon caches from the ZED service
      - jetson_stack_build:/root/ros2_ws/build
      - jetson_stack_install:/root/ros2_ws/install
      - jetson_stack_log:/root/ros2_ws/log

    environment:
      <<: *ros-env
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=humble
      - YOLOPV2_WEIGHTS=/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt

    # ODriveHardware (real robot) — NOT IsaacDriveHardware used in x86 sim
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        source /opt/ros/humble/setup.bash
        colcon build --symlink-install \
          --base-paths /root/ros2_ws/src/IGVC_robot_2026/src \
          --packages-select \
            zed_description \
            igvc_test_description \
            grr_hardware \
            igvc_lane_detection \
            igvc_test_bringup \
          --cmake-args -DCMAKE_BUILD_TYPE=Release
        source /root/ros2_ws/install/setup.bash
        ros2 launch igvc_test_bringup igvc_fused_drive.launch.py \
          hardware_interface:=ODriveHardware \
          use_sim_time:=false

volumes:
  # ZED area-memory: loop-closure database survives container lifecycle.
  # Replace with a bind mount above for full host persistence across reboots.
  zed_area_memory:

  # Colcon build caches — dramatically speed up incremental builds
  jetson_zed_build:
  jetson_zed_install:
  jetson_zed_log:
  jetson_stack_build:
  jetson_stack_install:
  jetson_stack_log:
