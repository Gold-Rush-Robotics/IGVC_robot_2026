  #     # Separate colcon caches from the ZED service
  #     - jetson_stack_build:/root/ros2_ws/build
  #     - jetson_stack_install:/root/ros2_ws/install
  #     - jetson_stack_log:/root/ros2_ws/log

  #   environment:
  #     <<: *ros-env
  #     DISPLAY: ${DISPLAY:-:0}
  #     QT_X11_NO_MITSHM: "1"
  #     ROS_DISTRO: humble
  #     YOLOPV2_WEIGHTS: /root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt

  #   # ODriveHardware (real robot) — NOT IsaacDriveHardware used in x86 sim
