# docker-compose.jetson.yml
# Full IGVC stack for Jetson Orin AGX — JetPack 6.x / L4T r36 (arm64).
#
# Two services mirror the x86 docker-compose.yml layout:
#   igvc_jetson_zed        — ROS 2 Jazzy + ZED SDK 5 (zed-ros2-wrapper)
#                            Connects to 3x ZED X cameras via GMSL2 (Argus)
#   igvc_jetson_stack      — ROS 2 Humble drive/nav stack
#                            ODrive motor control, lane detection, Nav2
#
# Both containers share the host network and the same FastDDS UDP profile so
# they form a single ROS graph (identical to the x86 dev setup).
#
# Usage:
#   docker compose -f docker-compose.jetson.yml up
#   docker compose -f docker-compose.jetson.yml up igvc_jetson_zed   # cameras only
#
# IMPORTANT — Jetson-specific prerequisites:
#   1. nvidia-container-toolkit installed and configured (JetPack 6 includes it)
#   2. GMSL2 cameras powered and MIPI/GMSL2 kernel driver loaded before `up`
#   3. Set ROS_DOMAIN_ID env var if sharing the ROS graph over LAN
#   4. For persistent ZED area-memory across reboots, mount a volume at
#      /tmp/zed_area_memory (see zed service volumes below)

x-ros-common: &ros-common
  stdin_open: true
  tty: true
  privileged: true          # Required for GMSL2 kernel access on Jetson
  network_mode: host        # Share ROS graph with host and other containers
  restart: unless-stopped
  environment: &ros-env
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    FASTDDS_DEFAULT_PROFILES_FILE: /root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
    FASTRTPS_DEFAULT_PROFILES_FILE: /root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ROS_LOCALHOST_ONLY: "0"

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Service 1: ZED X cameras — ROS 2 Jazzy + ZED SDK 5 on L4T r36
  # Runs zed_multi_real.launch.py → 3 camera nodes + EKF odometry fusion
  # ─────────────────────────────────────────────────────────────────────────
  igvc_jetson_zed:
    # Official Stereolabs image built for L4T r36 (JetPack 6.x, arm64).
    # Includes: ZED SDK 5, CUDA 12, TensorRT, ROS 2 Jazzy, zed-ros2-wrapper.
    image: ghcr.io/gold-rush-robotics/jetson-zed:5.3-36.4.7
    container_name: igvc_jetson_zed
    <<: *ros-common
    runtime: nvidia           # JetPack 6 nvidia-container-toolkit syntax (no gpus: key needed)
    ipc: host
    pid: host
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - /tmp:/tmp
      - /tmp/argus_socket:/tmp/argus_socket
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /var/nvidia/nvcam/settings:/var/nvidia/nvcam/settings
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service
      - /usr/local/zed/resources:/usr/local/zed/resources
      - /usr/local/zed/settings:/usr/local/zed/settings
      - zed_area_memory:/tmp/zed_area_memory
      # - jetson_zed_build:/root/ros2_ws/build
      # - jetson_zed_install:/root/ros2_ws/install
      # - jetson_zed_log:/root/ros2_ws/log

    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /root/.Xauthority
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      QT_X11_NO_MITSHM: "1"
# colcon build --symlink-install --packages-select igvc_test_bringup
